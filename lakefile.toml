name = "EllipticPeriodsIrrationality"
version = "0.1.0"
defaultTargets = ["SolutionElliptic", "ChallengeElliptic"]

[leanOptions]
autoImplicit = false

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4.git"
rev = "v4.35.0-rc2"

# Vendored from OpenAI's formalization of the irrationality of Catalan's constant
# (https://github.com/openai/math, commit fd4aeeb2ee4fc729c18d98444fed42fd0529eeeb),
# converted to the module system.  See NOTICE.
[[lean_lib]]
name = "VendoredOAI"
globs = ["OAI.+"]

# Vendored from PrimeNumberTheoremAnd as patched by OpenAI's repository.  See NOTICE.
[[lean_lib]]
name = "VendoredPNT"
globs = ["PrimeNumberTheoremAnd.+"]

# Vendored from Tau Ceti (https://github.com/TauCetiProject/TauCeti, Apache-2.0).  See NOTICE.
[[lean_lib]]
name = "VendoredTauCeti"
globs = ["TauCeti.+"]

# The development.
[[lean_lib]]
name = "CatalanCore"
roots = ["CatalanCore"]
globs = ["CatalanCore.+"]

# mu(omega) <= 3 for real periods of lattices with rational g2, g3.
[[lean_lib]]
name = "SolutionElliptic"
roots = ["SolutionElliptic"]

[[lean_lib]]
name = "ChallengeElliptic"
roots = ["ChallengeElliptic"]
